services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: liara_assistant
      POSTGRES_USER: liara_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liara_assistant -d liara_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8000
      DOCS_REPO_PATH: /workspace/docs
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - ../docs:/workspace/docs:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"]
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
